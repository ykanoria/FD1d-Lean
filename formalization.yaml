fidelity:
  divergences: >-
    The Lean target fixes C to 72000/log(2), strengthening the manuscript's
    existential universal constant. Its policy is memoryless in the current
    inventory and demand, which is a special case of the history-dependent
    online policies allowed by the manuscript. The initialization demands are
    universally quantified as fixed points and the independent post-refresh
    trajectory is modeled separately; this implies the manuscript's expected
    initialization guarantee because each scheduled match costs at most one.
    The implementation-complexity sentence is omitted: internal modules prove
    asymptotic inequalities for declared operation and memory accounting
    functions, but there is no executable operational semantics proving that
    evaluation of OnlinePolicy consumes those resources. The lower-bound-based
    optimality corollary and balanced-initial-law corollary are also omitted
    from the compared result.

