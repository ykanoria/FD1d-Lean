version: "v0.4"

project:
  name: "A Tight Upper Bound for Fully Dynamic Matching on the Line"
  description: >-
    There are `m` labeled supplies in `[0,1]`. In each period, an independent
    uniform demand arrives; an online policy selects one live supply, pays the
    distance between them, and replaces that supply by an independent uniform
    point. This is the one-dimensional fully dynamic model studied in Kanoria's
    [*Dynamic spatial matching*](https://doi.org/10.1214/25-AAP2154). That paper
    established a lower bound of order `log(m)/m` and an upper bound of order
    `log(m)^2/m`, and posed closing this logarithmic gap as an open problem.


    We construct a policy and show that its performance matches the prior known
    lower bound up to a universal constant factor. Specifically, for every
    `m >= 2`, from every fixed initial inventory, its root-mean-square one-period
    cost has limsup at most `C log(m+1)/m`, with `C = 72000/log(2)`. With a
    scheduled `m`-period replacement phase, its expected average cost, including
    that phase, has the same bound for every total horizon `N >= 2m^2`. The policy
    assigns deletion probabilities recursively on a dyadic tree and implements
    them by quantile transport. Its analysis combines a harmonic inventory
    potential with a quadratic Bellman inequality. Tree symmetry cancels
    interactions between spatial scales, while the Bellman inequality controls
    both transport discrepancy and the curvature loss in the potential drift.
  authors:
    - "Yash Kanoria"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yash Kanoria"

