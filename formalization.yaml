version: "v0.4"

project:
  name: "Optimal Fully Dynamic Matching on the Line: Lean Upper Bound"
  description: >-
    A Lean 4 formalization of the main constructive upper bound for fully
    dynamic matching on the unit interval. For every inventory size m at least
    two, the development constructs a measurable online policy for iid uniform
    demand and replenishment. From every fixed initial inventory it proves a
    limsup root-mean-square one-period cost of at most C log(m+1)/m, with the
    explicit universal constant C = 72000/log(2). After a scheduled m-period
    replacement phase, it proves the same upper bound for expected average cost
    at every horizon N at least 2m^2. The compared result deliberately excludes
    the manuscript's implementation-complexity sentence because the development
    has no operational cost semantics linking abstract counters to execution.
  authors:
    - "Yash Kanoria"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yash Kanoria"

