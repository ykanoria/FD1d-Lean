    initialized finite-horizon expected average cost. It constructs the policy
    and path-space law and proves explicit constants. The source manuscript's
    implementation-complexity sentence, lower-bound-based Theta corollary,
    optimal long-run corollary, balanced-initial-law corollary, and non-compared
    supporting propositions are not advertised as Palomar results.
